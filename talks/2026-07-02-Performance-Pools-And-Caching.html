  const img = document.getElementById("slide");
  const counter = document.getElementById("counter");
  const help = document.getElementById("help");

  function clampFromHash() {
    const n = parseInt((location.hash || "").replace("#", ""), 10);
    if (!Number.isNaN(n) && n >= 1 && n <= slides.length) return n - 1;
    return 0;
  }
  let i = clampFromHash();

  let hideTimer;
  function flash(el) { el.classList.add("show"); }
  function transientCounter() {
    counter.classList.add("show");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => counter.classList.remove("show"), 1400);
  }

  function render() {
    // Clear then set so the SVG re-decodes and its CSS animations restart,
    // even when re-visiting the same slide (data-URIs can't be cache-busted).
    img.src = "";
    img.src = slides[i].uri;
    counter.textContent = (i + 1) + " / " + slides.length + "  ·  " + slides[i].name.replace(/\.svg$/, "");
    transientCounter();
    history.replaceState(null, "", "#" + (i + 1));
  }

  function go(delta) {
    const next = i + delta;
    if (next < 0 || next >= slides.length) return;
    i = next;
    render();
  }
  function jump(idx) { i = Math.max(0, Math.min(slides.length - 1, idx)); render(); }

  document.addEventListener("keydown", (e) => {
    switch (e.key) {
      case "ArrowRight": case "PageDown": case " ": case "Spacebar":
        e.preventDefault(); go(1); break;
      case "ArrowLeft": case "PageUp":
        e.preventDefault(); go(-1); break;
      case "Home": e.preventDefault(); jump(0); break;
      case "End": e.preventDefault(); jump(slides.length - 1); break;
      case "f": case "F":
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
        break;
    }
  });

  document.querySelector(".zone.next").addEventListener("click", () => go(1));
  document.querySelector(".zone.prev").addEventListener("click", () => go(-1));

  flash(counter); flash(help);
  setTimeout(() => { counter.classList.remove("show"); help.classList.remove("show"); }, 2600);

  window.addEventListener("hashchange", () => { const n = clampFromHash(); if (n !== i) { i = n; render(); } });

  render();
